<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>おひさまマップ</title>
<meta name="description" content="地域ごとの起点から、家族で行けるお出かけスポットを地図で見て、行った記録を残すための個人用アプリ。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#10222E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おひさまマップ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
--ink:#10222E;
--ink-70:rgba(16,34,46,.70);
--ink-45:rgba(16,34,46,.45);
--line:rgba(16,34,46,.14);
--paper:#FFFFFF;
--shell:#F1F4F3;
--ring:#10222E;
--focus:#1D7FD6;
--shadow:0 6px 24px rgba(16,34,46,.16);
--sans:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
--pf:1;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
font-family:var(--sans);color:var(--ink);background:var(--shell);
font-feature-settings:"palt" 1;-webkit-font-smoothing:antialiased;
overflow:hidden;
}
#map{position:absolute;inset:0;background:#E7ECEA}
.leaflet-container{font-family:var(--sans)}
header{
position:absolute;top:0;left:0;right:0;z-index:600;
display:flex;align-items:baseline;gap:14px;
padding:12px 18px;
background:linear-gradient(to bottom,rgba(255,255,255,.96),rgba(255,255,255,.82) 70%,rgba(255,255,255,0));
pointer-events:none;
}
h1{
margin:0;font-size:17px;font-weight:900;letter-spacing:.02em;
}
h1 small{display:block;font-size:11px;font-weight:500;color:var(--ink-45);letter-spacing:.12em;margin-bottom:2px}
.count{
font-size:12px;color:var(--ink-70);font-weight:700;
font-variant-numeric:tabular-nums;white-space:nowrap;
}
/* 地域の切り替え。ここが一番上の区切りなので、パネルではなくヘッダーに置く */
.regions{display:flex;gap:5px;pointer-events:auto;margin-left:auto}
.regions button{
font:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;
border:1px solid var(--line);background:#fff;color:var(--ink-45);
border-radius:999px;padding:5px 13px;cursor:pointer;white-space:nowrap;
transition:background .12s,color .12s,border-color .12s;
}
.regions button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.regions button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.count b{font-size:19px;color:var(--ink)}
.panel{
position:absolute;z-index:700;top:64px;left:18px;width:300px;
max-height:calc(100% - 88px);
display:flex;flex-direction:column;
background:var(--paper);border-radius:14px;box-shadow:var(--shadow);
overflow:hidden;
}
.panel-scroll{overflow-y:auto;overscroll-behavior:contain}
.block{padding:13px 15px;border-bottom:1px solid var(--line)}
.block:last-child{border-bottom:0}
.lbl{
font-size:10px;letter-spacing:.14em;font-weight:700;color:var(--ink-45);
margin:0 0 9px;display:flex;justify-content:space-between;align-items:center;
}
.lbl button{
font:inherit;font-size:10px;letter-spacing:.08em;border:0;background:none;
color:var(--focus);cursor:pointer;padding:2px 4px;border-radius:4px;font-weight:700;
}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
display:inline-flex;align-items:center;gap:5px;
font:inherit;font-size:11.5px;font-weight:700;
border:1px solid var(--line);background:#fff;color:var(--ink-70);
border-radius:999px;padding:4px 9px 4px 7px;cursor:pointer;
transition:background .12s,color .12s,border-color .12s;
}
.chip .dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.chip[aria-pressed="false"]{opacity:.5}
.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.chip .n{font-variant-numeric:tabular-nums;opacity:.75;font-size:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0}
.row label{font-size:12.5px;font-weight:500}
.val{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-70)}
.row select{
font:inherit;font-size:12px;font-weight:700;color:var(--ink);
border:1px solid var(--line);background:#F8FAF9;border-radius:7px;padding:5px 7px;cursor:pointer;
}
.row select:disabled{color:var(--ink-45);cursor:default}
.row select:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.hint{font-size:10.5px;color:var(--ink-45);line-height:1.5;margin:1px 0 3px}
input[type=range]{width:100%;accent-color:var(--ink);margin:2px 0 0}
.toggle{
position:relative;width:38px;height:22px;border-radius:99px;border:0;
background:var(--line);cursor:pointer;flex:none;transition:background .15s;
}
.toggle::after{
content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s;
}
.toggle[aria-pressed="true"]{background:var(--ink)}
.toggle[aria-pressed="true"]::after{transform:translateX(16px)}
.toggle:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.list{padding:0}
.list-head{padding:11px 15px 7px;position:sticky;top:0;background:var(--paper);z-index:2}
.item{
width:100%;text-align:left;border:0;background:none;font:inherit;cursor:pointer;
padding:8px 15px;display:grid;grid-template-columns:10px 1fr auto;gap:9px;align-items:baseline;
border-top:1px solid var(--line);
/* 一覧は数百件になる。画面の外にある行の組版はブラウザに省いてもらう。
   これが無いと、地域を切り替えるたびに全行のレイアウトで200msほど固まる */
content-visibility:auto;contain-intrinsic-size:auto 48px;
}
.item:hover,.item:focus-visible{background:#F4F7F6;outline:none}
.item .bar{width:4px;height:100%;min-height:22px;border-radius:2px;background:var(--c);grid-row:span 2}
.item .nm{font-size:12.5px;font-weight:700;line-height:1.35}
.item .mt{font-size:10.5px;color:var(--ink-45);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.item .sub{grid-column:2/4;font-size:10.5px;color:var(--ink-45);margin-top:1px}
.empty{padding:22px 15px;font-size:12px;color:var(--ink-45);line-height:1.7}
.pin{
width:15px;height:15px;border-radius:50%;
border:2.5px solid #fff;box-shadow:0 1px 4px rgba(16,34,46,.45);
transition:transform .12s;
}
.pin.on{transform:scale(1.5);z-index:1000}
.pin{display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:900;line-height:1}
.pin.done::after{content:"✓"}
.pin.want{box-shadow:0 0 0 3px #F0B429,0 1px 4px rgba(16,34,46,.45)}
.pin.plan{box-shadow:0 0 0 3px #1D7FD6,0 1px 4px rgba(16,34,46,.45)}
.pin.skip{opacity:.3;filter:grayscale(1);transform:scale(.75)}
.conn{display:flex;flex-direction:column;gap:7px}
.conn input[type=url],.conn input[type=password]{
font:inherit;font-size:11.5px;width:100%;padding:7px 9px;border-radius:7px;
border:1px solid var(--line);background:#F8FAF9;color:var(--ink);
}
.conn input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.btnrow{display:flex;gap:6px}
.btn{
flex:1;font:inherit;font-size:11.5px;font-weight:700;padding:7px 6px;border-radius:7px;
border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.status-msg{font-size:10.5px;color:var(--ink-45);line-height:1.6;margin:2px 0 0}
.status-msg.err{color:#C0392B}
.status-msg.ok{color:#1F7A4D}
.status-msg.warn{color:#B26A00;font-weight:700}
.badge{
display:inline-block;font-size:9.5px;font-weight:900;padding:1px 5px;border-radius:4px;
background:var(--line);color:var(--ink-70);margin-right:5px;vertical-align:1px;
}
.badge.done{background:#1F7A4D;color:#fff}
.badge.want{background:#F0B429;color:#3A2A00}
.badge.plan{background:#1D7FD6;color:#fff}
.progress{
height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0 0;
}
.progress i{display:block;height:100%;background:#1F7A4D;width:0;transition:width .3s}
.rec{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.rec .today{width:100%;margin-bottom:8px;padding:calc(9px * var(--pf));font-size:calc(12.5px * var(--pf))}
.rec .today.done{background:#1F7A4D;border-color:#1F7A4D}
.st-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.st{
font:inherit;font-size:calc(10.5px * var(--pf));font-weight:700;border-radius:99px;cursor:pointer;
padding:calc(4px * var(--pf)) calc(8px * var(--pf));
border:1px solid var(--line);background:#fff;color:var(--ink-70);
}
.st[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.rec label{display:block;font-size:calc(10px * var(--pf));letter-spacing:.1em;font-weight:700;color:var(--ink-45);margin:0 0 3px}
.rec input[type=date],.rec textarea,.rec input[type=text]{
font:inherit;font-size:calc(12px * var(--pf));width:100%;border-radius:7px;
padding:calc(6px * var(--pf)) calc(8px * var(--pf));
border:1px solid var(--line);background:#F8FAF9;color:var(--ink);margin-bottom:8px;resize:vertical;
}
.rec input:focus-visible,.rec textarea:focus-visible,.st:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.stars{display:flex;gap:2px;margin-bottom:9px}
.star{
font:inherit;font-size:calc(17px * var(--pf));line-height:1;border:0;background:none;cursor:pointer;padding:1px 2px;
color:var(--line);
}
.star.lit{color:#F0B429}
.saved{font-size:calc(10px * var(--pf));color:#1F7A4D;font-weight:700;height:calc(13px * var(--pf));margin:0 0 6px;opacity:0;transition:opacity .2s}
.saved.show{opacity:1}
.home{
width:17px;height:17px;border-radius:50%;background:var(--ink);
border:3px solid #fff;box-shadow:0 2px 8px rgba(16,34,46,.5);
}
.leaflet-tooltip.nm-tip{
background:rgba(255,255,255,.94);border:0;border-radius:5px;
box-shadow:0 1px 5px rgba(16,34,46,.22);
font-size:10.5px;font-weight:700;color:var(--ink);padding:2px 6px;white-space:nowrap;
}
.leaflet-tooltip.nm-tip::before{display:none}
.leaflet-tooltip.ring-tip{
background:none;border:0;box-shadow:none;color:var(--ink-45);
font-size:10px;font-weight:700;letter-spacing:.1em;padding:0;
}
.leaflet-tooltip.ring-tip::before{display:none}
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:var(--shadow);padding:0;overflow:hidden}
/* 中身が画面に収まらないときはポップアップの中でスクロールさせる。
   overscroll-behavior で、端まで行っても地図側が動かないようにしておく */
/* --pf はポップアップの拡大率。パネルの「ポップアップの大きさ」で切り替える。
   小さい字が読みづらいときのために、幅と文字を一緒に伸ばす */
.leaflet-popup-content{
margin:0;line-height:1.5;
width:calc(264px * var(--pf))!important;max-width:calc(100vw - 40px);
max-height:min(68vh,520px);overflow-y:auto;overscroll-behavior:contain;
-webkit-overflow-scrolling:touch;
}
.pop-top{
padding:calc(12px * var(--pf)) calc(14px * var(--pf)) calc(10px * var(--pf));
padding-right:calc(78px * var(--pf));   /* 右上の拡大ボタンと文字が重ならないように */
color:#fff;position:sticky;top:0;z-index:1;
}
/* 見出しの中の拡大ボタン。パネルの奥まで探しに行かなくて済むよう、ここに置く。
   あとに続く見出しの下敷きにならないよう z-index を上げる */
.pop-zoom{position:absolute;top:6px;right:8px;display:flex;gap:4px;z-index:2}
.pop-zoom button{
font:inherit;font-size:calc(11px * var(--pf));font-weight:900;line-height:1;
color:#fff;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45);
border-radius:6px;padding:calc(3px * var(--pf)) calc(6px * var(--pf));cursor:pointer;
}
.pop-zoom button:disabled{opacity:.35;cursor:default}
.pop-zoom button:focus-visible{outline:2px solid #fff;outline-offset:1px}
/* 座標の無いスポットを一覧の中で開くカード。中身はポップアップと同じ */
.card{
border-top:1px solid var(--line);background:#F8FAF9;
box-shadow:inset 0 1px 6px rgba(16,34,46,.06);
}
.card .pop-top{position:static}
.badge.nopos{background:#E3E8E7;color:var(--ink-45)}
.pop-cat{font-size:calc(9.5px * var(--pf));letter-spacing:.13em;font-weight:700;opacity:.85}
.pop-nm{font-size:calc(15px * var(--pf));font-weight:900;margin-top:3px;line-height:1.3}
.pop-body{padding:calc(11px * var(--pf)) calc(14px * var(--pf)) calc(13px * var(--pf));font-size:calc(12px * var(--pf))}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px calc(10px * var(--pf));margin:0 0 9px;font-size:calc(11.5px * var(--pf))}
.facts dt{color:var(--ink-45);font-weight:700;white-space:nowrap}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.pop-body p{margin:0 0 8px;color:var(--ink-70);font-size:calc(11.5px * var(--pf))}
.pop-note{
background:#F4F7F6;border-left:3px solid var(--line);
padding:6px 9px;font-size:calc(11px * var(--pf));color:var(--ink-70);margin:0 0 10px;border-radius:0 5px 5px 0;
}
.links{display:flex;gap:7px}
.links a{
flex:1;text-align:center;text-decoration:none;font-size:calc(11.5px * var(--pf));font-weight:700;
padding:calc(7px * var(--pf)) 4px;border-radius:7px;border:1px solid var(--line);color:var(--ink);
}
.links a.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.links a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sheet-btn{display:none}
@media (max-width:720px){
/* 幅が足りないので、1行目にタイトルと件数、2行目に地域を置く。
   地域が増えても横スクロールで足りる */
header{padding:8px 14px 7px;gap:8px;flex-wrap:wrap}
h1{font-size:13.5px;white-space:nowrap}
h1 small{display:none}
.count{margin-left:auto}
.regions{order:3;width:100%;margin-left:0;gap:4px;overflow-x:auto;scrollbar-width:none}
.regions::-webkit-scrollbar{display:none}
.regions button{font-size:11.5px;padding:4px 11px;flex:0 0 auto}
.panel{
top:auto;bottom:0;left:0;right:0;width:auto;border-radius:16px 16px 0 0;
max-height:72%;transform:translateY(calc(100% - 46px));transition:transform .22s ease;
}
.panel.open{transform:translateY(0)}
.sheet-btn{
display:flex;align-items:center;justify-content:center;gap:8px;
width:100%;height:46px;flex:none;border:0;background:var(--paper);
font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink);
}
.sheet-btn::before{
content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);
width:34px;height:4px;border-radius:2px;background:var(--line);
}
.leaflet-popup-content{width:calc(238px * var(--pf))!important;max-width:calc(100vw - 32px);max-height:min(58vh,420px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="map"></div>

<header>
  <h1><small>FAMILY OUTINGS</small>おひさまマップ</h1>
  <div class="regions" id="regions"></div>
  <div class="count"><b id="shown">0</b> / <span id="total">0</span> 件</div>
</header>

<aside class="panel" id="panel">
  <button class="sheet-btn" id="sheetBtn" aria-expanded="false">絞り込みと一覧</button>
  <div class="panel-scroll">
    <div class="block">
      <p class="lbl">おでかけの記録</p>
      <div class="conn">
        <p class="status-msg" id="msg">ピンをタップして「今日行った」を押すだけ。記録は自動で保存されます。</p>
        <div class="progress"><i id="bar"></i></div>
        <p class="status-msg" id="dirty"></p>
        <div id="tokenWrap" hidden>
          <input type="password" id="token" placeholder="あいことば" autocomplete="current-password">
          <button class="btn pri" id="connect" style="width:100%;margin-top:6px">つなぐ</button>
        </div>
        <div class="btnrow">
          <button class="btn" id="expJson">書き出す</button>
          <button class="btn" id="impJson">読み込む</button>
          <button class="btn" id="copyJson">コピー</button>
        </div>
        <input type="file" id="file" accept=".json,.csv,application/json,text/csv" hidden>
      </div>
    </div>
    <div class="block">
      <p class="lbl">訪問状況</p>
      <div class="chips" id="stats"></div>
    </div>
    <div class="block">
      <p class="lbl">カテゴリ <button id="allCat">すべて表示</button></p>
      <div class="chips" id="cats"></div>
    </div>
    <div class="block">
      <p class="lbl">条件</p>
      <div class="row"><label for="car">車で<span class="val" id="carV"></span></label></div>
      <!-- max と初期値はデータの最大値から JS が入れ直す -->
      <input type="range" id="car" min="15" max="100" step="5" value="100">
      <div class="row"><label for="train">電車・バスで<span class="val" id="trainV"></span></label></div>
      <input type="range" id="train" min="20" max="150" step="10" value="150">
      <div class="row"><label for="month">特におすすめの月</label>
        <select id="month">
          <option value="0">指定なし</option>
        </select></div>
      <p class="hint" id="monthHint"></p>
      <div class="row"><label for="rain">雨の日でも行ける（◎○）</label><button class="toggle" id="rain" aria-pressed="false"></button></div>
      <div class="row"><label for="names">施設名を地図に表示</label><button class="toggle" id="names" aria-pressed="false"></button></div>
      <p class="hint" id="nameHint"></p>
      <div class="row"><label for="popSize">ポップアップの大きさ</label>
        <select id="popSize">
          <option value="1">標準</option>
          <option value="1.25">大きめ</option>
          <option value="1.5">特大</option>
        </select></div>
      <div class="row"><label for="rings" id="ringLbl">起点からの距離の輪</label><button class="toggle" id="rings" aria-pressed="true"></button></div>
    </div>
    <div class="block list">
      <p class="lbl list-head">近い順（車の最短時間）</p>
      <div id="list"></div>
    </div>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="spots.js"></script>
<script>
/* Leaflet(CDN)が来ていないと、この先の L.map() で落ちて画面が真っ白のまま止まる。
   何が起きたか出してから止める。ここで throw するとこのスクリプトだけが終わる。 */
if(typeof L === 'undefined'){
  const m = document.getElementById('msg');
  if(m){
    m.textContent = '地図の部品を読み込めませんでした。通信状態を確かめて、開き直してください。';
    m.className = 'status-msg err';
  }
  document.getElementById('map').innerHTML =
    '<p style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;' +
    'margin:0;padding:24px;text-align:center;font-size:13px;line-height:1.8;color:rgba(16,34,46,.45)">' +
    '地図を読み込めませんでした。<br>電波の届くところで開き直してください。</p>';
  throw new Error('Leaflet unavailable');
}

const SPOTS = window.__SPOTS__ || [];

/* 地域（関東・沖縄…）が一番上の区切り。スポットは必ずどれか1つに属する。
   所要時間も距離の輪も、その地域の中心（起点）から見たもの。 */
const REGIONS = window.__REGIONS__ || [];
const FALLBACK = {id:'', name:'—', center:{name:'起点', lat:35.5496391, lng:139.620117}, rings:[10,20,30,40]};
let region = REGIONS[0] || FALLBACK;

/* storage: Claude artifact storage if present, else localStorage, else memory */
const store = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k); return r ? r.value : null; } }catch(e){}
    try{ return localStorage.getItem(k); }catch(e){ return null; }
  },
  async set(k,v){
    try{ if(window.storage){ await window.storage.set(k,v); return; } }catch(e){}
    try{ localStorage.setItem(k,v); }catch(e){}
  }
};

function drawHome(){

    L.circle([HOME.lat,HOME.lng],{
      radius:km*1000, color:'#10222E', weight:1, opacity:.28,
      dashArray:'3 6', fill:km===rings[0], fillColor:'#10222E', fillOpacity:.03, interactive:false

      .bindTooltip(km+'km',{permanent:true,direction:'center',className:'ring-tip'}).addTo(ringLayer);

  homeMarker = L.marker([HOME.lat,HOME.lng],{

    zIndexOffset:1000

const gmapUrl = s => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.name);
function statusOf(s){
  const v = (records[s.id] && records[s.id]['訪問状況']) || '候補';
  return STATUS[v] ? v : '候補';
}
function pinIcon(s){
  const st = STATUS[statusOf(s)];
  return L.divIcon({
    className:'',
    html:`<div class="pin ${st.cls}" style="background:${s.color}"></div>`,
    iconSize:[15,15], iconAnchor:[7.5,7.5]
  });
}

function popup(s){
  const r = records[s.id] || {};
  const sv = statusOf(s);
  const f = [];
  if(s.c1) f.push(['車', `${s.c1}–${s.c2}分`]);
  if(s.t1) f.push(['電車・バス', `${s.t1}–${s.t2}分`]);
  if(s.rain) f.push(['雨の日', s.rain]);
  if(s.season) f.push(['おすすめ', s.season]);
  if(s.age) f.push(['年齢', s.age]);
  if(s.rate) f.push(['評価', `★ ${s.rate}`]);
  const rec = [];
  if(r['同行者']) rec.push(['同行者', r['同行者']]);
  const done = sv === '訪問済み';
  const rate = +(r['満足度'] || 0);
  const stars = [1,2,3,4,5].map(i =>
    `<button class="star ${i<=rate?'lit':''}" data-star="${i}" aria-label="満足度${i}">★</button>`).join('');
  const sts = SORDER.map(k =>
    `<button class="st" data-st="${k}" aria-pressed="${k===sv}">${STATUS[k].label}</button>`).join('');

  const size = +((typeof el === 'function' && el('popSize')) ? el('popSize').value : 1);
  return `
  <div class="pop-top" style="background:${s.color}">
    <div class="pop-zoom">
      <button data-pz="-" aria-label="表示を小さくする"${size <= PSIZES[0] ? ' disabled' : ''}>A−</button>
      <button data-pz="+" aria-label="表示を大きくする"${size >= PSIZES[PSIZES.length-1] ? ' disabled' : ''}>A＋</button>
    </div>
    <div class="pop-cat">${esc(s.cat)}${s.sub?' ／ '+esc(s.sub):''}</div>
    <div class="pop-nm">${esc(s.name)}</div>
  </div>
  <div class="pop-body">
    <dl class="facts">${f.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}
      ${rec.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}
      <dt>場所</dt><dd>${esc(s.addr)}</dd></dl>
    <p>${esc(s.desc)}</p>
    ${s.note?`<div class="pop-note">${esc(s.note)}</div>`:''}
    <div class="links">
      <a class="pri" href="${gmapUrl(s)}" target="_blank" rel="noopener">地図で開く</a>
      ${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">公式サイト</a>`:''}
    </div>
    <div class="rec" data-id="${s.id}">
      <button class="btn pri today ${done?'done':''}" data-today>${done?'訪問済み　日付を今日にする':'今日行った'}</button>
      <div class="st-row">${sts}</div>
      <label for="d-${s.id}">訪問日</label>
      <input type="date" id="d-${s.id}" data-f="訪問日" value="${esc(r['訪問日']||'')}">
      <label>満足度</label>
      <div class="stars">${stars}</div>
      <label for="m-${s.id}">メモ</label>
      <textarea id="m-${s.id}" rows="2" data-f="家族メモ" placeholder="子どもの反応、混み具合、次にやりたいこと">${esc(r['家族メモ']||'')}</textarea>
      <p class="saved">保存しました</p>
    </div>
  </div>`;
}

/* ---- records: save & restore ----
   mode 'server' = records.json in this folder (start.command / start.bat running)
   mode 'local'  = browser storage fallback                                        */
const KEY = 'outing-records-v1';
let saveTimer = null, mode = 'local';

const API = '/api/records';
let token = '';
function showTokenInput(show){ const w = el('tokenWrap'); if(w) w.hidden = !show; }
async function pullRemote(){
  if(!token) return false;
  try{
    const r = await fetch(API, {cache:'no-store', headers:{'X-Token':token}});
    if(r.status === 401){ showTokenInput(true); msg('あいことばが違うようです。', 'err'); return false; }
    if(!r.ok) return false;
    const o = await r.json();
    Object.keys(records).forEach(k => delete records[k]);
    Object.entries(o).forEach(([k,v]) => records[k] = v);
    mode = 'server'; showTokenInput(false);
    return true;
  }catch(e){ return false; }
}
async function pushRemote(){
  const res = await fetch(API, {
    method:'POST',
    headers:{'Content-Type':'application/json', 'X-Token':token},
    body:JSON.stringify(records)
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
}
function msg(text, kind){
  const m = el('msg'); m.textContent = text; m.className = 'status-msg' + (kind ? ' '+kind : '');
}
function saveRecords(){
  updateDirty();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    if(mode === 'server'){
      try{
        await pushRemote();
        msg('保存しました。', 'ok');
      }catch(e){
        store.set(KEY, JSON.stringify(records));
        msg('サーバーに保存できませんでした（' + e.message + '）。この端末に控えたので、電波が戻ったら「つなぐ」を押してください。', 'err');
      }
    } else {
      store.set(KEY, JSON.stringify(records));
    }
  }, 350);
}
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){
      if(ch === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if(ch === '"'){ q = true; }
    else if(ch === ','){ row.push(cell); cell = ''; }
    else if(ch === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if(cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}
function ingestCSV(text){
  const rows = parseCSV(text);
  const head = rows[0].map(h => h.trim());
  const idx = head.indexOf('ID');
  if(idx < 0) throw new Error('ID列が見つかりません');
  let n = 0;
  rows.slice(1).forEach(r=>{
    const id = (r[idx]||'').trim(); if(!id) return;
    const o = {}; head.forEach((h,i)=>{ const v = (r[i]||'').trim(); if(v) o[h] = v; });
    if(Object.keys(o).length > 1){ records[id] = o; n++; }
  });
  return n;
}
const SNAP = 'outing-export-snapshot-v1';
let snapshot = '';
function updateDirty(){
  const n = Object.keys(records).length;
  const d = el('dirty'); if(!d) return;
  if(mode === 'server'){
    d.textContent = '✓ サーバーに自動保存されます';
    d.className = 'status-msg ok';
    el('expJson').classList.remove('pri');
    return;
  }
  if(!n){ d.textContent = ''; d.className = 'status-msg'; el('expJson').classList.remove('pri'); return; }
  const dirty = JSON.stringify(records) !== snapshot;
  d.textContent = dirty ? '⚠ まだ書き出していない記録があります' : '✓ 書き出し済みです';
  d.className = 'status-msg ' + (dirty ? 'warn' : 'ok');
  el('expJson').classList.toggle('pri', dirty);
}
function markExported(){
  snapshot = JSON.stringify(records);
  store.set(SNAP, snapshot);
  updateDirty();
}
el('copyJson').onclick = async ()=>{
  const text = JSON.stringify(records);
  try{
    await navigator.clipboard.writeText(text);
    msg('記録をコピーしました。Claudeのチャットに貼れば、元のExcelに反映できます。', 'ok');
    markExported();
  }catch(e){ msg('コピーできませんでした。「書き出す」を使ってください。', 'err'); }
};
el('expJson').onclick = ()=>{
  const blob = new Blob([JSON.stringify(records,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'おでかけ記録_' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
  msg('記録を書き出しました。このファイルがあれば、いつでも元に戻せます。', 'ok');
  markExported();
};
el('impJson').onclick = ()=> el('file').click();
el('file').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      let n;
      if(/\.csv$/i.test(f.name)) n = ingestCSV(rd.result);
      else {
        const o = JSON.parse(rd.result);
        n = 0; Object.entries(o).forEach(([k,v])=>{ records[k] = v; n++; });
      }
      saveRecords(); refreshMarkers();
      msg(n + '件の記録を読み込みました。', 'ok');
    }catch(err){ msg('読み込めませんでした（' + err.message + '）。', 'err'); }
  };
  rd.readAsText(f);
  e.target.value = '';
};
function refreshMarkers(){
  SPOTS.forEach(s => { if(s.marker) s.marker.setIcon(pinIcon(s)); });
  render();
}
el('connect').onclick = async ()=>{
  token = el('token').value.trim();
  if(!token){ msg('あいことばを入れてください。', 'err'); return; }
  await store.set('api-token', token);
  if(await pullRemote()){ refreshMarkers(); updateDirty(); msg('つながりました。', 'ok'); }
};
(async ()=>{
  token = (await store.get('api-token')) || '';
  if(!token) showTokenInput(true);
  if(await pullRemote()){
    refreshMarkers(); updateDirty();
    const n = Object.values(records).filter(r => r['訪問状況'] === '訪問済み').length;
    msg('記録を読み込みました' + (n ? '（訪問済み ' + n + '件）' : '') + '。編集は自動で保存されます。', 'ok');
    return;
  }
  snapshot = (await store.get(SNAP)) || '';
  const raw = await store.get(KEY);
  if(raw){
    try{
      Object.entries(JSON.parse(raw)).forEach(([k,v])=> records[k] = v);
      refreshMarkers();
      const n = Object.values(records).filter(r => r['訪問状況'] === '訪問済み').length;
      if(n) msg('前回までの記録を読み込みました（訪問済み ' + n + '件）。', 'ok');
      updateDirty();
    }catch(e){}
  }
})();

function bindRange(id, key, fmt){
  const r = el(id), v = el(id+'V');
  const upd = ()=>{ state[key] = +r.value; v.textContent = fmt(+r.value); render(); };
  r.addEventListener('input', upd); upd();
}
bindRange('car','car', v => v>=CAR_MAX ? '時間はこだわらない' : v+'分以内');
bindRange('train','train', v => v>=TRAIN_MAX ? '時間はこだわらない' : v+'分以内');

function bindToggle(id, fn, init){
  const b = el(id);
  b.addEventListener('click',()=>{
    const on = b.getAttribute('aria-pressed')!=='true';
    b.setAttribute('aria-pressed',String(on)); fn(on);
  });
  if(init!==undefined) fn(init);
}

/* ポップアップの大きさ。字が小さくて読みづらいときに幅ごと拡大する。
   CSSの --pf を変えるだけで、中の文字も余白も一緒に伸びる */
const PKEY = 'outing-popsize-v1';
const PSIZES = [1, 1.25, 1.5];
function nextPopSize(dir){
  const now = PSIZES.indexOf(+el('popSize').value);
  const i = Math.min(PSIZES.length - 1, Math.max(0, (now < 0 ? 0 : now) + (dir === '+' ? 1 : -1)));
  return PSIZES[i];
}
function setPopSize(v, save){
  const f = PSIZES.includes(+v) ? +v : 1;
  document.documentElement.style.setProperty('--pf', f);
  el('popSize').value = String(f);
  if(save) store.set(PKEY, String(f));
  /* 開いたままなら、新しい大きさに合わせて位置を取り直す。
     update() は中身を作り直すので、書きかけのメモを預けて、ボタンをつなぎ直す */
  const open = map._popup;
  if(open && open.isOpen()){
    const before = open.getElement().querySelector('textarea');
    const memo = before ? before.value : null;
    open.update();
    const root = open.getElement();
    const after = root.querySelector('textarea');
    if(after && memo != null) after.value = memo;
    wirePopup(root);
  }
  /* 一覧の中に開いているカードも作り直す */
  el('list').querySelectorAll('.card').forEach(card=>{
    const item = card.previousElementSibling;
    const sp = item && SPOTS.find(x => x.id === item.dataset.id);
    if(!sp) return;
    const memo = card.querySelector('textarea');
    const keep = memo ? memo.value : null;
    card.innerHTML = popup(sp);
    const after = card.querySelector('textarea');
    if(after && keep != null) after.value = keep;
    wirePopup(card);
  });
}
el('popSize').addEventListener('change', e => setPopSize(e.target.value, true));
(async ()=>{ const v = await store.get(PKEY); if(v) setPopSize(v, false); })();

bindToggle('rain', on=>{state.rainOnly=on; render();});
bindToggle('names', on=>{state.names=on; render();});
bindToggle('rings', on=> on ? ringLayer.addTo(map) : map.removeLayer(ringLayer));

/* render */
function visible(s){
  if(s.region !== region.id) return false;
  if(!active.has(s.cat)) return false;
  if(!activeStatus.has(statusOf(s))) return false;
  if(state.car<CAR_MAX && (!s.c1 || s.c1>state.car)) return false;
  if(state.train<TRAIN_MAX && (!s.t1 || s.t1>state.train)) return false;
  if(state.rainOnly && !['◎','○'].includes(s.rain)) return false;
  if(state.month && !(s.months || []).includes(state.month)) return false;
  return true;
}
/* 名前のラベルは、常時表示にすると1つずつDOMを作るので数が効く。
   画面に入っているものだけ常時表示にして、外のものはホバー時だけにする。
   183件を一度に常時表示すると400ms近く固まっていた */
function setTooltip(s, permanent){
  s.marker.unbindTooltip();
  s.marker.bindTooltip(s.name, permanent
    ? {permanent:true,direction:'right',offset:[9,0],className:'nm-tip'}
    : {direction:'top',offset:[0,-8],className:'nm-tip'});
  s.tipPerm = permanent;
}

function render(){
  if(frame) return;
  frame = requestAnimationFrame(()=>{ frame = 0; draw(); });
}
function draw(){
  const vis = SPOTS.filter(visible).sort((a,b)=>(a.c1||999)-(b.c1||999));
  const keep = new Set(vis.filter(onMapAble).map(s=>s.id));
  SPOTS.forEach(s=>{
    if(onMap.has(s.id) && !keep.has(s.id)){ layer.removeLayer(s.marker); onMap.delete(s.id); }
  });
  /* 名前のラベルは1つずつDOMを作るので、数が増えると重い。しかも一面に出ると読めない。
     画面に入っているものの、地図の中心に近い順に LABEL_MAX 件までにする。
     拡大すれば画面内の数が減るので、その分だけ名前が増える */
  let labels = null, capped = false;
  const pinned = vis.filter(onMapAble);
  if(state.names){
    const box = map.getBounds().pad(0.2), c = map.getCenter();
    const cand = pinned.filter(s => box.contains(s.marker.getLatLng()));
    capped = cand.length > LABEL_MAX;
    if(capped){
      cand.sort((a,b) => c.distanceTo(a.marker.getLatLng()) - c.distanceTo(b.marker.getLatLng()));
      cand.length = LABEL_MAX;
    }
    labels = new Set(cand.map(s => s.id));
  }
  pinned.forEach(s=>{
    if(!onMap.has(s.id)){ s.marker.addTo(layer); onMap.add(s.id); }
    const perm = !!(labels && labels.has(s.id));
    if(s.tipPerm !== perm) setTooltip(s, perm);
  });
  el('nameHint').textContent = capped
    ? `名前は中心に近い${LABEL_MAX}件まで。拡大すると増えます` : '';
  el('shown').textContent = vis.length;

  /* 件数・状況・進み具合は、今見ている地域の中だけで数える */
  const mine = regionSpots();
  const cnt = {}; SORDER.forEach(k => cnt[k] = 0);
  mine.forEach(s => cnt[statusOf(s)]++);
  SORDER.forEach(k=>{
    const n = el('stats').querySelector(`[data-cnt="${k}"]`);
    if(n) n.textContent = cnt[k];
  });
  ORDER.forEach(c=>{
    const n = el('cats').querySelector(`[data-cnt-cat="${c}"]`);
    if(n) n.textContent = mine.filter(s => s.cat === c).length;
  });
  el('bar').style.width = (mine.length ? cnt['訪問済み'] / mine.length * 100 : 0) + '%';

  /* 並びと状況が同じなら組み直さない。スマホでシートを閉じている間も作らない */
  const sig = vis.map(s => s.id + statusOf(s)).join();
  if(!listShown()){ listSig = null; return; }
  if(sig === listSig) return;
  listSig = sig;

  /* 開いているカードは節点ごと預かって、組み直したあとに戻す。
     作り直すと入力中の状態も「保存しました」も消えてしまう */
  const card = el('list').querySelector('.card');
  if(card) card.remove();

  el('list').innerHTML = vis.length ? vis.map(s=>`
    <button class="item" data-id="${s.id}" style="--c:${s.color}">
      <span class="bar"></span><span class="nm">${
        statusOf(s)!=='候補' ? `<span class="badge ${STATUS[statusOf(s)].tone}">${STATUS[statusOf(s)].label}</span>` : ''
      }${onMapAble(s) ? '' : '<span class="badge nopos">地図なし</span>'}${esc(s.name)}</span>
      <span class="mt">車${s.c1||'–'}分</span>
      <span class="sub">${esc(s.cat)}・${esc(s.addr)}${s.rain?'・雨'+s.rain:''}</span>
    </button>`).join('')
    : `<p class="empty">条件に合うスポットがありません。${
        state.month ? state.month + '月がおすすめのスポットだけに絞っています。月を「指定なし」に戻すか、' : ''
      }所要時間をゆるめるか、カテゴリを追加してください。</p>`;

  if(card && cardId){
    const item = el('list').querySelector(`.item[data-id="${cardId}"]`);
    if(item) item.after(card); else cardId = null;   /* 絞り込みで消えたら閉じる */
  }
}
/* 画面外に出たラベルを外し、入ってきたものに付ける */
map.on('moveend', ()=>{ if(state.names) render(); });

/* 横向きにするとパネルがシートから横置きに変わる。閉じている間は一覧を作っていないので、
   幅が変わったら作り直す */
window.addEventListener('resize', ()=>{ listSig = null; render(); });

el('list').addEventListener('click',e=>{
  const b = e.target.closest('.item'); if(!b) return;
  const s = SPOTS.find(x=>x.id===b.dataset.id);
  /* 座標が無いスポットは地図に出せないので、一覧の中で開く */
  if(!onMapAble(s)){ openCard(b, s); return; }
  if(window.innerWidth<=720) el('panel').classList.remove('open');
  map.flyTo([s.lat,s.lng], Math.max(map.getZoom(),13), {duration:.6});
  /* 移動しながら開くと、ポップアップの自動スクロールが移動前の位置で計算されて
     上端がヘッダーに隠れる。移動が終わってから開く（念のため時間でも保険をかける） */
  let opened = false;
  const open = ()=>{ if(opened) return; opened = true; s.marker.openPopup(); };
  map.once('moveend', open);
  setTimeout(open, 800);
});

/* 座標の無いスポットを一覧の中で開く。中身はポップアップと同じものを使う。
   開いているカードは cardId で覚えておき、一覧を組み直すときは同じ節点を挿し直す
   （作り直すと、記録するたびに閉じてしまう） */
function openCard(item, s){
  const already = cardId === s.id;
  el('list').querySelectorAll('.card').forEach(c => c.remove());
  cardId = already ? null : s.id;
  if(already) return;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = popup(s);
  item.after(card);
  wirePopup(card);
  card.scrollIntoView({block:'nearest', behavior:'smooth'});
}

/* ---- editing inside the popup ---- */
function flash(root){
  const p = root.querySelector('.saved'); if(!p) return;
  p.classList.add('show'); clearTimeout(p._t);
  p._t = setTimeout(()=> p.classList.remove('show'), 1400);
}
function set(id, field, value){
  const r = records[id] || (records[id] = {ID:id});
  if(value === '' || value == null) delete r[field]; else r[field] = value;
  saveRecords();
  const s = SPOTS.find(x => x.id === id);
  if(s && s.marker) s.marker.setIcon(pinIcon(s));   /* 座標の無いスポットはピンが無い */
  render();
}
const today = ()=>{
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
};
/* ポップアップの中身は開くたびに作り直されるので、そのつどボタンをつなぎ直す。
   大きさを変えたときも中身が作り直されるため、そこからも呼ぶ。
   一覧の中に開くカード（座標の無いスポット）も同じ中身なので、これを使う */
function wirePopup(root){
  root.querySelectorAll('[data-pz]').forEach(b=>{
    b.addEventListener('click', ev=>{
      ev.stopPropagation();
      setPopSize(nextPopSize(b.dataset.pz), true);
    });
  });
  const rec = root.querySelector('.rec');
  if(rec) wireRec(rec);
}
function wireRec(root){
  const id = root.dataset.id;

  root.querySelector('[data-today]').addEventListener('click',()=>{
    set(id, '訪問状況', '訪問済み');
    set(id, '訪問日', today());
    root.querySelector('[data-f="訪問日"]').value = today();
    root.querySelectorAll('.st').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.st === '訪問済み')));
    const t = root.querySelector('[data-today]');
    t.classList.add('done'); t.textContent = '訪問済み　日付を今日にする';
    flash(root);
  });

  root.querySelectorAll('.st').forEach(b=>{
    b.addEventListener('click',()=>{
      set(id, '訪問状況', b.dataset.st);
      root.querySelectorAll('.st').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
      const t = root.querySelector('[data-today]'), done = b.dataset.st === '訪問済み';
      t.classList.toggle('done', done);
      t.textContent = done ? '訪問済み　日付を今日にする' : '今日行った';
      flash(root);
    });
  });

  root.querySelectorAll('.star').forEach(b=>{
    b.addEventListener('click',()=>{
      const v = +b.dataset.star;
      const cur = +(records[id] && records[id]['満足度'] || 0);
      const nv = cur === v ? 0 : v;
      set(id, '満足度', nv || '');
      root.querySelectorAll('.star').forEach(o => o.classList.toggle('lit', +o.dataset.star <= nv));
      flash(root);
    });
  });

  root.querySelectorAll('[data-f]').forEach(inp=>{
    inp.addEventListener('change',()=>{ set(id, inp.dataset.f, inp.value.trim()); flash(root); });
  });
  root.querySelector('textarea').addEventListener('keydown', e => e.stopPropagation());
}
map.on('popupopen', ev=>{
  /* 左のパネル（スマホでは下のシート）に隠れないところまで地図を動かす。
     大きさを上げると隠れやすいので、そのぶん余白も広く取る */
  const wide = window.innerWidth > 720;
  ev.popup.options.autoPanPaddingTopLeft = L.point(wide ? 336 : 20, 80);
  ev.popup.options.autoPanPaddingBottomRight = L.point(20, wide ? 24 : 70);
  ev.popup._adjustPan();
  wirePopup(ev.popup.getElement());
});

/* mobile sheet */
el('sheetBtn').addEventListener('click',()=>{
  const p = el('panel'), open = p.classList.toggle('open');
  el('sheetBtn').setAttribute('aria-expanded',String(open));
  el('sheetBtn').textContent = open ? '閉じる' : '絞り込みと一覧';
  if(open) render();   /* 閉じている間は一覧を作っていないので、開いたときに作る */
});

/* ---- 地域の切り替え ---- */
const RKEY = 'outing-region-v1';
el('regions').innerHTML = REGIONS.map(r=>
  `<button data-region="${r.id}" aria-pressed="false">${esc(r.name)}</button>`).join('');
el('regions').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.region === region.id) return;
  setRegion(b.dataset.region, true);
  store.set(RKEY, region.id);
});

function fitRegion(){
  const mine = regionSpots().filter(onMapAble);   /* 座標の無いものは範囲に入れられない */
  if(mine.length){
    map.fitBounds(L.latLngBounds(mine.map(s=>[s.lat,s.lng])).extend([HOME.lat,HOME.lng]),
      {padding:[60,60], paddingTopLeft:[window.innerWidth>720?330:40, 80]});
  } else {
    map.setView([HOME.lat,HOME.lng], 12);
  }
}
function setRegion(id, moveMap){
  const found = REGIONS.find(r => r.id === id);
  if(found) region = found;
  HOME = region.center;
  el('regions').querySelectorAll('button').forEach(b=>
    b.setAttribute('aria-pressed', String(b.dataset.region === region.id)));
  el('ringLbl').textContent = HOME.name + 'からの距離の輪';
  el('total').textContent = regionSpots().length;
  syncMonth();
  drawHome();
  render();
  if(moveMap) fitRegion();
}

setRegion(region.id, false);
if(SPOTS.some(onMapAble)){
  fitRegion();
} else {
  /* spots.js が読めなかったとき。地図だけでも起点を出しておく */
  map.setView([HOME.lat,HOME.lng], 12);
  msg('スポットのデータを読み込めませんでした。通信状態を確かめて、開き直してください。','err');
}

/* 前回見ていた地域に戻す */
(async ()=>{
  const saved = await store.get(RKEY);
  if(saved && saved !== region.id && REGIONS.some(r => r.id === saved)) setRegion(saved, true);
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
