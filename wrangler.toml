name = "odekake-map"
compatibility_date = "2026-07-01"
pages_build_output_dir = "public"

# 本番（main ブランチのデプロイ）で使うKV。
# npx wrangler kv namespace create RECORDS で出てきた id をここに書く。
[[kv_namespaces]]
binding = "RECORDS"
id = "PUT_YOUR_KV_NAMESPACE_ID_HERE"

# プレビュー（main 以外のブランチのデプロイ）。ここを書かないとプレビューには
# バインディングが付かず、/api/records が 500 を返す。
# 本番の記録を触らせたくないので、別の名前空間を作って id を入れること。
#   npx wrangler kv namespace create RECORDS_PREVIEW
[env.preview]
[[env.preview.kv_namespaces]]
binding = "RECORDS"
id = "PUT_YOUR_PREVIEW_KV_NAMESPACE_ID_HERE"
