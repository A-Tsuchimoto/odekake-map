name: deploy

# main に入ったら本番へ、それ以外のブランチはプレビューへ。
# 事前に GitHub の Settings > Secrets に2つ入れておくこと。
#   CLOUDFLARE_API_TOKEN   … Cloudflare で "Cloudflare Pages:Edit" 権限のトークンを作る
#   CLOUDFLARE_ACCOUNT_ID  … ダッシュボード右側に出ているアカウントID
# 手元から npm run deploy しても同じものが出る。CIは使わなくてもよい。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: スポットデータの確認
        run: npm run check

  deploy:
    needs: check
    # Secrets の入らないフォークからのPRでは動かさない
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 出力先は wrangler.toml の pages_build_output_dir を見る
          command: pages deploy --branch=${{ github.ref_name }}
